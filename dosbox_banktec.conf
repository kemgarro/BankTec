# Configuracion DOSBox para BankTec
# Generada automaticamente

[sdl]
windowresolution=800x600
output=surface

[dosbox]
memsize=32

[cpu]
core=auto
cputype=386
cycles=10000

[dos]
xms=true
ems=true
umb=true

[autoexec]
# Montar la carpeta del proyecto como unidad C:
mount c C:/Users/garro/TEC/Paradigmas/BankTec
c:
echo.
echo === BankTec DOSBox ===
echo Escribe BUILD para compilar y ejecutar.
echo Escribe BANKTEC para solo ejecutar.
echo.
